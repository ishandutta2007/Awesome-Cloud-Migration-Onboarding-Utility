<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    
    /* Animation Keyframes */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(12px); opacity: 0.8; }
      100% { transform: translateY(0) translateX(0); opacity: 0.2; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -120; }
    }

    .orb-1 {
      animation: pulseOrb 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 1000px 320px;
    }
    .data-stream {
      stroke: url(#cloudGrad);
      stroke-width: 2.5;
      stroke-dasharray: 8 12;
      animation: dashStream 4s linear infinite;
      fill: none;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }

    /* Typography styles - strictly foreground */
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .pill-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1;
      rx: 16px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #cbd5e1;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Background Grid -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />

    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Background Ambient Glow Orbs (Layered behind foreground) -->
  <g class="dynamic-background">
    <circle cx="180" cy="90" r="140" fill="url(#glowGrad)" class="orb-1" filter="url(#softGlow)" />
    <circle cx="1020" cy="330" r="160" fill="url(#glowGrad)" class="orb-2" filter="url(#softGlow)" />

    <!-- Animated Migration Stream Path across canvas bottom -->
    <path d="M 80,360 Q 300,320 600,360 T 1120,340" class="data-stream" />
    <path d="M 120,380 Q 400,340 700,380 T 1100,360" class="data-stream" opacity="0.5" />

    <!-- Subtle Floating Data Particles -->
    <circle cx="280" cy="120" r="4" fill="#38bdf8" class="particle-1" />
    <circle cx="940" cy="140" r="3.5" fill="#a855f7" class="particle-2" />
    <circle cx="1050" cy="220" r="5" fill="#818cf8" class="particle-3" />
    <circle cx="150" cy="270" r="3" fill="#38bdf8" class="particle-2" />
  </g>

  <!-- Decorative Cloud Migration Graphic Icon (Top Right Header Area) -->
  <g transform="translate(1000, 75)" opacity="0.85">
    <!-- Cloud Path -->
    <path d="M 0,40 A 24,24 0 0,1 36,20 A 36,36 0 0,1 92,24 A 26,26 0 0,1 115,50 A 22,22 0 0,1 106,78 L 10,78 A 20,20 0 0,1 0,40 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)" />
    <!-- Migration Arrow Up -->
    <path d="M 54,65 L 54,36 M 44,46 L 54,34 L 64,46" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content: Unobstructed & Crisp -->
  <g transform="translate(80, 0)">
    <!-- Category Tagline -->
    <text x="0" y="95" class="tagline-text">⚡ Curated Enterprise &amp; Open-Source Directory</text>

    <!-- Main Title with Gradient Fill for Emphasis -->
    <text x="0" y="155" class="title-text">
      Awesome <tspan fill="url(#cloudGrad)">Cloud Migration</tspan> &amp; Onboarding
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="200" class="subtitle-text">
      Workload replication, database re-platforming, storage sync &amp; automated onboarding utilities.
    </text>

    <!-- Feature Pills / Technology Badges -->
    <g transform="translate(0, 245)">
      <!-- Pill 1: Workload Lift & Shift -->
      <rect x="0" y="0" width="180" height="34" class="pill-bg" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" />
      <text x="32" y="22" class="pill-text">🚀 Workload Migration</text>

      <!-- Pill 2: Database Sync -->
      <rect x="195" y="0" width="170" height="34" class="pill-bg" />
      <circle cx="213" cy="17" r="5" fill="#818cf8" />
      <text x="227" y="22" class="pill-text">🗄️ Database Sync</text>

      <!-- Pill 3: SaaS & Open Source -->
      <rect x="380" y="0" width="185" height="34" class="pill-bg" />
      <circle cx="398" cy="17" r="5" fill="#a855f7" />
      <text x="412" y="22" class="pill-text">🌐 SaaS &amp; Open-Source</text>

      <!-- Pill 4: Automation & DR -->
      <rect x="580" y="0" width="195" height="34" class="pill-bg" />
      <circle cx="598" cy="17" r="5" fill="#34d399" />
      <text x="612" y="22" class="pill-text">🔄 Automated Onboarding</text>
    </g>

    <!-- Key Metrics / Sub-footer Info inside banner -->
    <g transform="translate(0, 320)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="500" fill="#64748b">
        Coverage: Multi-Cloud (AWS, Azure, GCP) • Kubernetes • Storage Engines • Zero-Downtime Replication
      </text>
    </g>
  </g>
</svg>
